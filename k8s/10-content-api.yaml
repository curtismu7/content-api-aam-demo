apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-api
  namespace: content-api-aam-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-api
  template:
    metadata:
      labels:
        app: content-api
    spec:
      containers:
        - name: content-api
          image: "${IMAGE_REGISTRY}content-api-aam-demo-content-api:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: content-api
  namespace: content-api-aam-demo
spec:
  selector:
    app: content-api
  ports:
    - port: 8080
      targetPort: 8080
